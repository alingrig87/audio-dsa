<!DOCTYPE html>
<html lang="ro">
<head>

<title>DSA Povești 🎧 — Google Interview</title>
<style>
:root {
  --bg: #080810;
  --surface: #10101c;
  --surface2: #14142a;
  --card: #1c1c30;

  --text: #e2e8f0;
  --muted: #6b7280;
  --dim: #9ca3af;
  --yellow: #fbbf24;

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; height:100dvh;
  display:flex; flex-direction:column; overflow:hidden;
}
.hdr {
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:.6rem 1.5rem; display:flex; align-items:center; gap:.75rem; flex-shrink:0;
}
.hdr-logo { font-size:1.4rem; }
.hdr-title { font-size:1rem; font-weight:600; }
.hdr-sub { font-size:.7rem; color:var(--muted); }
.hdr-right { margin-left:auto; display:flex; align-items:center; gap:.75rem; }
select.voice-sel {
  background:var(--surface2); border:1px solid var(--border); color:var(--dim);
  padding:.3rem .6rem; border-radius:6px; font-size:.72rem; cursor:pointer; max-width:240px;
}
select.voice-sel:focus { outline:none; border-color:var(--accent); }
.layout { display:flex; flex:1; overflow:hidden; }
.sidebar {
  width:250px; background:var(--surface); border-right:1px solid var(--border);
  overflow-y:auto; flex-shrink:0; padding:.6rem;
}
.sidebar-lbl {
  font-size:.65rem; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:.08em; padding:.4rem .5rem .6rem;
}
.ep-card {
  display:flex; align-items:center; gap:.6rem; padding:.6rem .75rem;
  border-radius:8px; cursor:pointer; margin-bottom:.2rem;
  border:1px solid transparent; transition:all .2s;
}
.ep-card:hover { background:var(--surface2); border-color:var(--border); }
.ep-card.active { background:var(--glow); border-color:var(--accent); }
.ep-card.locked { opacity:.35; cursor:not-allowed; }
.ep-emoji { font-size:1.3rem; flex-shrink:0; }
.ep-info { flex:1; min-width:0; }
.ep-title { font-size:.8rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ep-sub { font-size:.68rem; color:var(--muted); }
.ep-dur { font-size:.62rem; color:var(--muted); margin-top:.1rem; }
.ep-lock { font-size:.65rem; color:var(--muted); }
.main { flex:1; overflow-y:auto; display:flex; flex-direction:column; }
.ep-hdr { padding:1.5rem 2rem 1rem; border-bottom:1px solid var(--border); }
.ep-hdr-top { display:flex; align-items:center; gap:.75rem; margin-bottom:.5rem; }
.ep-big-emoji { font-size:2.2rem; }
.ep-num { font-size:.7rem; color:var(--accent-l); font-weight:600; text-transform:uppercase; letter-spacing:.08em; }

.tag { font-size:.68rem; padding:.15rem .55rem; border-radius:20px; background:var(--surface2); color:var(--dim); border:1px solid var(--border); }
.sections { padding:1.25rem 2rem; display:flex; flex-direction:column; gap:.9rem; }
.sec {
  border-radius:10px; padding:1.1rem 1.3rem;
  border:1px solid var(--border); background:var(--card);
  transition:all .3s; cursor:pointer;

.sec:hover { border-color:rgba(99,102,241,.3); }
.sec.active { border-color:var(--accent); background:var(--surface2); box-shadow:0 0 22px var(--glow); }
.sec.done { opacity:.5; }
.sec-lbl { font-size:.62rem; font-weight:700; color:var(--accent-l); text-transform:uppercase; letter-spacing:.08em; margin-bottom:.45rem; }
.sec-text { font-size:.92rem; line-height:1.75; color:var(--text); }

.btn { border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:all .2s; }

.btn-play:hover { background:var(--accent-l); transform:scale(1.05); }
.btn-play:disabled { background:var(--muted); cursor:not-allowed; transform:none; }
.btn-skip { width:34px; height:34px; background:var(--surface2); color:var(--dim); font-size:.85rem; }
.btn-skip:hover { background:var(--card); color:var(--text); }
.spd-btn { font-size:.7rem; font-weight:700; color:var(--muted); background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:.28rem .5rem; cursor:pointer; min-width:42px; text-align:center; }
.spd-btn:hover { color:var(--text); border-color:var(--accent); }
.status { font-size:.7rem; color:var(--muted); min-width:80px; text-align:center; white-space:nowrap; }
.cached-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green); margin-left:4px; vertical-align:middle; }

::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:3px; }
@media(max-width:600px) {
  .sidebar { display:none; }
  .sections { padding:.9rem; }
  .ep-hdr { padding:1rem; }

  .btn-play { width:56px; height:56px; font-size:1.4rem; }
  .btn-skip { width:42px; height:42px; font-size:1rem; }
  .spd-btn { padding:.4rem .6rem; font-size:.75rem; }
  .status { min-width:50px; font-size:.65rem; }
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-spin { display:inline-block; animation:spin .8s linear infinite; }

      vox:`Imaginează-ți că ești administratorul unui bloc ultramodern — Array Tower. Blocul are exact zece etaje, dar numerotarea nu începe de la unu, ci de la zero. Avem etajul zero, etajul unu, etajul doi, până la etajul nouă. Aceasta este prima regulă de aur în programare: numărăm întotdeauna de la zero. Fiecare apartament găzduiește exact un singur locatar — un număr, un text, orice valoare. Și cel mai important: blocul are o dimensiune fixă. Odată construit, nu poți adăuga sau elimina etaje!`

Vrei să muți un nou locatar la etajul 3? <em>Toți cei de la etajul 3 în sus trebuie să se mute cu un etaj mai sus!</em> Etajul 3 → 4, etajul 4 → 5... și tot așa.<br><br>

      vox:`Acum vine dezavantajul principal al array-ului. Vrei să muți un nou locatar la etajul trei? Toți cei de la etajul trei în sus trebuie să se mute cu un etaj mai sus! Etajul trei merge la patru, patru merge la cinci, și tot așa. Dacă blocul are o mie de apartamente și inserezi la poziția zero, toate cele o mie de familii se mută. Inserarea în array are complexitate O de n. Când ai nevoie de inserări frecvente, ArrayList sau LinkedList sunt alegeri mai potrivite.`

`import java.util.Arrays;

// arr → {1, 2, 3, 5, 8, 9}   O(n log n)

// arr → {0, 0, 0, 0, 0, 0}

int[] copie = Arrays.copyOf(arr, 10);
// primele 6 copiate, restul 0

      vox:`Iată armele tale secrete din clasa Arrays. Importă cu import java.util.Arrays. Arrays punct sort de arr sortează în ordine crescătoare, complexitate O de n log n. Arrays punct fill de arr virgulă zero umple toate pozițiile cu zero. Arrays punct copyOf de arr virgulă zece face o copie cu zece locuri. Arrays punct copyOfRange de arr virgulă unu virgulă patru copiază elementele de la indexul unu până la trei, patru exclusiv. Arrays punct toString de arr transformă array-ul într-un String frumos pentru afișare. Și arr punct length, fără paranteze, îți spune numărul de elemente.`
    },
    {
      lbl:'🎯 Pattern: Two Pointers',
      html:`<strong>Two Pointers</strong> este un pattern eficient pentru array-uri <strong>sortate</strong>.<br><br>
<em>Problemă:</em> Într-un array <strong>sortat</strong>, găsește două numere care adunate dau o țintă.<br><br>
<em>Metoda naivă:</em> Verifici fiecare pereche posibilă → <strong>O(n²)</strong>. Prea lent!<br><br>
<em>Metoda Two Pointers:</em><br>
• Pui un deget <em>(left)</em> la primul element<br>
• Pui alt deget <em>(right)</em> la ultimul element<br>
• Suma prea mare → muți <em>right</em> spre stânga<br>
• Suma prea mică → muți <em>left</em> spre dreapta<br>
• Continui până găsești sau pointerii se întâlnesc<br><br>
Rezultat: <strong>O(n)</strong> — de n ori mai rapid!`,
      code:
`public int[] twoSum(int[] arr, int target) {
    int left = 0;
    int right = arr.length - 1;

    while (left < right) {
        int sum = arr[left] + arr[right];

        if (sum == target)     return new int[]{left, right};
        else if (sum < target) left++;   // avem nevoie de mai mult
        else                   right--;  // avem nevoie de mai puțin
    }
    return new int[]{};   // nu există
}`,
      vox:`Two Pointers este un pattern eficient pentru array-uri sortate. Problema: Într-un array sortat, găsește două numere care adunate dau o țintă. Metoda naivă: verifici fiecare pereche posibilă — O de n pătrat. Prea lent! Metoda Two Pointers: pui un deget, pe care îl numim left, la primul element. Pui alt deget, pe care îl numim right, la ultimul element. Dacă suma e prea mare, muți right spre stânga. Dacă suma e prea mică, muți left spre dreapta. Continui până găsești sau pointerii se întâlnesc. Rezultatul este O de n — de n ori mai rapid! Aceasta este magia algoritmilor.`
    },
    {
      lbl:'🪟 Pattern: Sliding Window',
      html:`<strong>Sliding Window</strong> — Fereastra Glisantă — este perfect pentru <em>subarray-uri consecutive</em>.<br><br>
<em>Problemă:</em> Găsește suma maximă a k elemente consecutive.<br><br>
<em>Metoda naivă:</em> Calculezi suma pentru fiecare fereastră de la zero → <strong>O(n·k)</strong>.<br><br>
<em>Sliding Window:</em> Calculezi prima fereastră, apoi pentru fiecare pas: <strong>scazi primul element și adaugi cel nou</strong>. Nu recalculezi totul!<br><br>
Este ca o cameră cu k ferestre care glisează de-a lungul blocului → <strong>O(n)</strong>!`,
      code:
`public int sumaMaxima(int[] arr, int k) {
    int suma = 0;
    for (int i = 0; i < k; i++) suma += arr[i];

    int max = suma;

    for (int i = k; i < arr.length; i++) {
        suma += arr[i];      // adăugăm noul element din dreapta
        suma -= arr[i - k];  // scoatem elementul ieșit din stânga
        max = Math.max(max, suma);
    }
    return max;   // O(n)!
}`,
      vox:`Sliding Window, sau Fereastra Glisantă, este perfect pentru subarray-uri consecutive. Problema: Găsește suma maximă a k elemente consecutive. Metoda naivă: calculezi suma pentru fiecare fereastră de la zero — O de n ori k. Sliding Window: calculezi prima fereastră, apoi pentru fiecare pas scazi primul element și adaugi cel nou. Nu recalculezi totul! Este ca o cameră cu k ferestre care glisează de-a lungul blocului. Rezultatul este O de n — mult mai eficient!`
    },
    {
      lbl:'🧠 Când să folosești ce?',
      html:`Alegerea structurii potrivite depinde de proprietățile array-ului și de operația necesară:<br><br>
<strong>Array sortat + căutare element</strong><br>

<strong>Subarray-uri sau subșiruri consecutive</strong><br>
→ <em>Sliding Window</em><br><br>
<strong>Frecvența sau existența valorilor</strong><br>
→ <em>HashMap sau HashSet</em><br><br>
<strong>Cel mai mare / mic element dinamic</strong><br>
→ <em>Heap (PriorityQueue)</em><br><br>
<strong>Complexități:</strong> Acces O(1) &nbsp;•&nbsp; Căutare O(n) &nbsp;•&nbsp; Inserare O(n) &nbsp;•&nbsp; Sortare O(n log n)`,
      vox:`Alegerea structurii potrivite depinde de proprietățile array-ului și de operația necesară. Dacă array-ul este sortat și ai nevoie să cauți un element, folosești Binary Search sau Two Pointers. Dacă ai nevoie să lucrezi cu subarray-uri sau subșiruri consecutive, folosești Sliding Window. Dacă ai nevoie să memorezi frecvența sau existența valorilor, folosești HashMap sau HashSet. Dacă ai nevoie de cel mai mare sau cel mai mic element în mod dinamic, folosești Heap sau PriorityQueue. Complexitățile de bază: Acces O de unu. Căutare O de n. Inserare O de n. Sortare O de n log n.`
    },

    { lbl:'➕ Inserare',
      html:`<strong>La HEAD — O(1):</strong> Creezi nod nou, setezi next spre fostul head.<br><br>
<strong>La TAIL / MIJLOC — O(n):</strong> Traversezi până la poziție, modifici referințele.<br><br>
Avantaj față de array: <em>nu se deplasează alte elemente</em>.`,
      code:`// La HEAD — O(1)
public ListNode addHead(ListNode head, int val) {
    ListNode node = new ListNode(val);
    node.next = head;
    return node;
}

// La TAIL — O(n)

    while (curr.next != null) curr = curr.next;
    curr.next = new ListNode(val);
}`,
      vox:`Inserarea la head este O de unu: creezi un nod nou, setezi next-ul lui spre fostul head, și noul head devine nodul creat. Nu se deplasează nimic. Inserarea la tail sau la mijloc este O de n: traversezi până la poziția dorită, modifici referințele. Avantajul față de array: nu se mută alte elemente.`

      code:`// HEAD — O(1)
public ListNode deleteHead(ListNode head) {
    return head.next;
}

// Nod cu valoare val — O(n)
public ListNode delete(ListNode head, int val) {
    if (head.val == val) return head.next;
    ListNode curr = head;
    while (curr.next != null) {
        if (curr.next.val == val) {
            curr.next = curr.next.next;
            return head;
        }
        curr = curr.next;
    }
    return head;
}`,
      vox:`Ștergerea la head este O de unu: head-ul devine head punct next. Ștergerea unui nod din mijloc este O de n: traversezi până la nodul anterior, setezi prev punct next egal cu node punct next. Nodul este scurtcircuitat din lanț și va fi colectat de garbage collector.`

<strong>Detectare ciclu:</strong> Dacă există ciclu, fast și slow se întâlnesc.<br>
<strong>Mijlocul listei:</strong> Când fast atinge finalul, slow e la mijloc.`,
      code:`public boolean hasCycle(ListNode head) {
    ListNode slow = head, fast = head;
    while (fast != null && fast.next != null) {
        slow = slow.next;
        fast = fast.next.next;
        if (slow == fast) return true;
    }
    return false;
}

public ListNode findMiddle(ListNode head) {
    ListNode slow = head, fast = head;
    while (fast != null && fast.next != null) {
        slow = slow.next;
        fast = fast.next.next;
    }
    return slow;
}`,

      code:`public ListNode reverse(ListNode head) {

    while (curr != null) {

        prev = curr;
        curr = next;
    }
    return prev;  // noul head
}`,

public int[] nextGreater(int[] arr) {

    { lbl:'🎯 Pattern: Two Sum cu HashMap',
      html:`Problema Two Sum fără array sortat — <strong>O(n)</strong> cu HashMap.<br><br>
Pentru fiecare element calculăm <em>complement = target - element</em>.<br>
Dacă complementul există în map, am găsit perechea. Altfel, adăugăm elementul.`,
      code:`public int[] twoSum(int[] nums, int target) {
    Map<Integer, Integer> map = new HashMap<>();
    // map: valoare → index

    for (int i = 0; i < nums.length; i++) {
        int complement = target - nums[i];

        if (map.containsKey(complement)) {
            return new int[]{map.get(complement), i};
        }
        map.put(nums[i], i);
    }
    return new int[]{};
}`,
      vox:`Problema Two Sum fără array sortat se rezolvă în O de n cu un HashMap. Pentru fiecare element, calculăm complementul: target minus elementul curent. Verificăm dacă complementul există în map. Dacă da, am găsit perechea. Dacă nu, adăugăm elementul curent cu indexul său și continuăm. Un singur parcurs, O de n.`
    },
    { lbl:'📋 Rezumat',
      html:`<strong>HashMap&lt;K,V&gt;</strong> — perechi cheie-valoare, O(1) amortizat<br>
• <em>put / get / getOrDefault / containsKey / remove</em><br><br>
<strong>HashSet&lt;T&gt;</strong> — valori unice, O(1) amortizat<br>
• <em>add / contains / remove</em><br><br>
<strong>Patternuri:</strong><br>
• <em>Frequency Map</em> — numărare cu getOrDefault<br>
• <em>Two Sum</em> — complement lookup O(n)`,
      vox:`Rezumat HashMap și HashSet. HashMap stochează perechi cheie valoare cu operații O de unu amortizat: put, get, getOrDefault, containsKey, remove. HashSet stochează valori unice cu add, contains, remove în O de unu. Patternul Frequency Map numără frecvențele cu getOrDefault. Patternul Two Sum găsește perechi cu suma dată în O de n prin complement lookup.`
    }
  ]
},

      code:`public List<List<Integer>> levelOrder(TreeNode root) {
    List<List<Integer>> res = new ArrayList<>();
    if (root == null) return res;

    Queue<TreeNode> q = new ArrayDeque<>();
    q.offer(root);

    while (!q.isEmpty()) {
        int size = q.size();          // noduri pe nivelul curent
        List<Integer> level = new ArrayList<>();

        for (int i = 0; i < size; i++) {
            TreeNode node = q.poll();
            level.add(node.val);
            if (node.left  != null) q.offer(node.left);
            if (node.right != null) q.offer(node.right);
        }
        res.add(level);
    }
    return res;  // O(n) timp, O(n) spațiu
}`,
      vox:`BFS parcurge arborele nivel cu nivel. Adăugăm root-ul în queue. La fiecare iterație a buclei while, procesăm toate nodurile de pe nivelul curent: le extragem din queue și adăugăm copiii lor pentru nivelul următor. Dimensiunea queue-ului la start de buclă ne spune câte noduri sunt pe nivelul curent. Complexitate O de n timp și O de n spațiu.`

      code:`// Căutare în BST
TreeNode search(TreeNode root, int target) {
    if (root == null || root.val == target) return root;
    if (target < root.val) return search(root.left, target);
    else                   return search(root.right, target);
}

// Inserare în BST
TreeNode insert(TreeNode root, int val) {
    if (root == null) return new TreeNode(val);
    if (val < root.val) root.left  = insert(root.left,  val);
    else                root.right = insert(root.right, val);
    return root;
}`,
      vox:`Un BST respectă proprietatea: pentru orice nod, tot subarborele stâng este mai mic, iar tot subarborele drept este mai mare. Căutarea funcționează ca binary search: dacă valoarea e mai mică decât nodul curent, mergem stânga; dacă e mai mare, mergem dreapta. Pe arbore echilibrat: O de log n. Pe arbore dezechilibrat degradează la O de n.`

<strong>DFS — O(n), O(h) spațiu:</strong><br>

• Postorder: L → R → Root<br><br>
<strong>BFS — O(n):</strong> nivel cu nivel, cu Queue<br><br>
<strong>BST:</strong> stânga &lt; nod &lt; dreapta → O(log n) echilibrat`,

    { lbl:'🎲 Povestea — Jocul de Ghicit Numărul',
      html:`Ai jucat vreodată jocul: <em>„Mă gândesc la un număr între 1 și 100. Ghicește!"</em>?<br><br>

Acesta este <strong>Binary Search</strong>. Funcționează pe orice <em>colecție sortată</em>. Dacă elementele nu ar fi în ordine, nu am ști în ce direcție să ne ducem după fiecare comparație.`,
      vox:`Ai jucat vreodată jocul: mă gândesc la un număr între unu și o sută, ghicește? Un jucător naiv începe de la unu, doi, trei... și poate face o sută de încercări. Dar jucătorul inteligent spune mereu: cincizeci. Mai mare! Șaptezeci și cinci. Mai mic! Șaizeci și doi. Mai mic! Cincizeci și șase. Exact! Patru încercări pentru o sută de numere. Logica este simplă: la fiecare pas, eliminăm jumătate din posibilități. Nu verificăm fiecare număr — înjumătățim spațiul de căutare. Acesta este Binary Search. Funcționează pe orice colecție sortată. Dacă elementele nu ar fi în ordine, nu am ști în ce direcție să ne ducem după fiecare comparație.`
    },
    { lbl:'☕ Template iterativ standard',
      html:`Cei trei pointeri: <em>left</em>, <em>right</em>, <em>mid</em>.<br><br>
Calculul mid: <code>left + (right - left) / 2</code> — evită overflow față de <code>(left + right) / 2</code>.`,
      code:`public int binarySearch(int[] arr, int target) {
    int left = 0, right = arr.length - 1;

    while (left <= right) {
        int mid = left + (right - left) / 2;

        if      (arr[mid] == target) return mid;
        else if (arr[mid] <  target) left  = mid + 1;
        else                         right = mid - 1;
    }
    return -1;  // nu există
}`,
      vox:`Template-ul standard folosește trei pointeri: left la zero, right la ultimul index, și mid calculat la fiecare pas. Mid egal left plus right minus left împărțit la doi — această formulă evită overflow. Dacă elementul din mijloc este egal cu target, returnăm indexul. Dacă e mai mic, mutăm left la mid plus unu. Dacă e mai mare, mutăm right la mid minus unu. Ne oprim când left devine mai mare decât right.`
    },
    { lbl:'📍 Variație: Prima și ultima apariție',
      html:`Când array-ul conține <em>duplicate</em> și ai nevoie de prima sau ultima apariție.<br><br>
La egalitate: continuăm căutarea în direcția dorită în loc să ne oprim.`,
      code:`// Prima apariție
public int firstOccurrence(int[] arr, int target) {
    int left = 0, right = arr.length - 1, result = -1;
    while (left <= right) {
        int mid = left + (right - left) / 2;
        if (arr[mid] == target) { result = mid; right = mid - 1; } // continuăm stânga
        else if (arr[mid] < target) left = mid + 1;
        else right = mid - 1;
    }
    return result;
}

// Ultima apariție: la egalitate → left = mid + 1, result = mid`,
      vox:`Când array-ul conține duplicate și ai nevoie de prima apariție, modificăm template-ul: la egalitate, salvăm indexul în result și continuăm în jumătatea stângă setând right la mid minus unu. Astfel ajungem la prima apariție. Pentru ultima apariție, la egalitate continuăm în jumătatea dreaptă setând left la mid plus unu.`
    },
    { lbl:'🎯 Binary Search pe spațiul de răspunsuri',
      html:`Binary Search nu se aplică doar pe array-uri, ci și pe un <em>interval de valori posibile</em>.<br><br>
Dacă putem scrie o funcție <em>canAchieve(value)</em> care returnează true/false monoton, putem face binary search pe interval.`,
      code:`// Găsește capacitatea minimă de transport pentru a livra în D zile
public int shipInDDays(int[] weights, int D) {
    int left  = Arrays.stream(weights).max().getAsInt(); // min posibil
    int right = Arrays.stream(weights).sum();             // max posibil

    while (left < right) {
        int mid = left + (right - left) / 2;
        if (canShip(weights, mid, D)) right = mid;
        else                          left  = mid + 1;
    }
    return left;
}

boolean canShip(int[] w, int cap, int D) {
    int days = 1, curr = 0;
    for (int x : w) {
        if (curr + x > cap) { days++; curr = 0; }
        curr += x;
    }
    return days <= D;
}`,
      vox:`Binary search pe răspunsuri: nu căutăm un element, ci cea mai mică sau cea mai mare valoare validă dintr-un interval. Dacă putem scrie o funcție care verifică dacă o valoare este validă, și răspunsurile valide formează un interval continuu, putem face binary search pe acel interval. Exemplu: găsește capacitatea minimă de transport pentru a livra colete în D zile. Căutăm pe intervalul de capacități posibile.`
    },
    { lbl:'📋 Rezumat',
      html:`<strong>Binary Search — O(log n)</strong> — doar pe colecții sortate<br><br>
<strong>Template:</strong> <code>left=0, right=n-1, mid=left+(right-left)/2</code><br>
• Egalitate → return mid<br>
• Mai mic → left = mid+1<br>
• Mai mare → right = mid-1<br><br>
<strong>Variații:</strong><br>
• Prima apariție: la egalitate → right = mid-1<br>
• Ultima apariție: la egalitate → left = mid+1<br>
• Pe răspunsuri: binary search pe intervalul de valori posibile`,
      vox:`Rezumat Binary Search. Complexitate O de log n, funcționează doar pe colecții sortate. Template standard: left zero, right n minus unu, mid egal left plus right minus left împărțit la doi. La egalitate returnăm; mai mic, mutăm left; mai mare, mutăm right. Variații: pentru prima apariție, la egalitate continuăm stânga; pentru ultima, continuăm dreapta. Binary search pe răspunsuri: căutăm pe intervalul valorilor posibile când putem verifica validitatea monoton.`
    }
  ]

    { lbl:'🏥 Povestea — Sala de Urgențe',

Pacienții nu sunt tratați în ordinea sosirii. O persoană cu o tăietură mică la deget care a venit prima nu va fi tratată înaintea unui pacient cu atac de cord care a venit mai târziu. <strong>Prioritatea contează, nu momentul sosirii.</strong><br><br>

      vox:`Imaginează-ți sala de așteptare a unui spital de urgențe. Pacienții nu sunt tratați în ordinea sosirii. O persoană cu o tăietură mică la deget care a venit prima nu va fi tratată înaintea unui pacient cu atac de cord care a venit mai târziu. Prioritatea contează, nu momentul sosirii. Fiecare pacient primește un cod de urgență: roșu critic, galben moderat, verde minor. Medicul ia mereu pacientul cu codul cel mai critic — cel mai mic număr de prioritate. Aceasta este exact logica unui Min-Heap: elementul cu valoarea minimă este mereu la vârf, gata să fie extras. Când un nou pacient sosește, se inserează în O de log n. Când medicul cheamă, extrage pacientul cel mai critic în O de log n. Max-Heap ar fi invers: cel mai mare număr la vârf. Evident, nu vrei asta la urgențe.`

    { lbl:'☕ PriorityQueue în Java',
      code:`import java.util.PriorityQueue;

    { lbl:'🎯 Pattern: Top K Elements',
      html:`Găsește cele mai mari <em>K</em> elemente dintr-o colecție.<br><br>

• La final, heap-ul conține top K<br><br>

      code:`public int[] topKLargest(int[] nums, int k) {
    PriorityQueue<Integer> heap = new PriorityQueue<>(); // min-heap

    for (int num : nums) {
        heap.offer(num);
        if (heap.size() > k) heap.poll(); // elimină cel mai mic
    }

    int[] res = new int[k];
    for (int i = k - 1; i >= 0; i--) res[i] = heap.poll();
    return res;
}

    PriorityQueue<Integer> heap = new PriorityQueue<>();
    for (int num : nums) {
        heap.offer(num);
        if (heap.size() > k) heap.poll();
    }
    return heap.peek(); // al k-lea cel mai mare
}`,
      vox:`Patternul Top K folosește un Min-Heap de dimensiune K. Parcurgem elementele și adăugăm fiecare în heap. Dacă heap-ul depășește K elemente, eliminăm minimul. Astfel, la final heap-ul conține exact cele mai mari K elemente. Vârful heap-ului este al K-lea cel mai mare element. Complexitate: O de n log k — eficient când K este mic față de n.`

int[] bfs(int start, List<Integer>[] g) {
    int[] dist = new int[g.length];

    Queue<Integer> q = new ArrayDeque<>();

        for (int nb : g[node]) {

Cu <em>path compression</em> + <em>union by rank</em>: <strong>O(α(n)) ≈ O(1)</strong>`,
      code:`class UnionFind {
    int[] parent, rank;
    UnionFind(int n) {
        parent = new int[n]; rank = new int[n];
        for (int i = 0; i < n; i++) parent[i] = i;
    }
    int find(int x) {
        if (parent[x] != x) parent[x] = find(parent[x]); // path compression
        return parent[x];
    }
    boolean union(int x, int y) {
        int px = find(x), py = find(y);
        if (px == py) return false; // deja conectați → ciclu!
        if (rank[px] < rank[py]) { int t = px; px = py; py = t; }
        parent[py] = px;
        if (rank[px] == rank[py]) rank[px]++;
        return true;
    }
}`,

    },

      vox:`Dynamic Programming se aplică problemelor cu două proprietăți. Prima: subprobleme suprapuse — aceleași subprobleme se rezolvă de mai multe ori în recursie simplă. A doua: substructură optimă — soluția optimă conține soluțiile optime ale subproblemelor. DP memorează rezultatele subproblemelor, transformând complexitatea exponențială în polinomială.`

    { lbl:'📓 Povestea — Matematicianul cu Caietul de Notițe',

Un coleg îl întreabă: <em>„Cât face Fibonacci de 40?"</em> Matematicianul naiv calculează recursiv, apelând Fibonacci de 39 plus Fibonacci de 38, și fiecare dintre acestea se descompun la rândul lor, și tot așa. <strong>Milioane de calcule, aceleași subprobleme recalculate de mii de ori.</strong><br><br>
Matematicianul inteligent are un <strong>caiet de notițe</strong>. De fiecare dată când calculează un rezultat, îl scrie în caiet. Data viitoare când cineva îl întreabă același lucru, nu recalculează — <em>deschide caietul și citește răspunsul</em>.<br><br>
Fibonacci de 38? Am calculat-o ieri — stă la pagina 38 din caiet. O secundă.<br><br>
Aceasta este esența <strong>Dynamic Programming</strong>: <em>memorezi rezultatele subproblemelor</em> pentru a nu le recalcula. Caietul este structura noastră de date — un array sau un HashMap. Fiecare pagină este o subproblemă rezolvată o singură dată.`,
      vox:`Există un matematician care rezolvă probleme complexe. Un coleg îl întreabă: cât face Fibonacci de patruzeci? Matematicianul naiv calculează recursiv, apelând Fibonacci de treizeci și nouă plus Fibonacci de treizeci și opt, și fiecare dintre acestea se descompun la rândul lor, și tot așa. Milioane de calcule, aceleași subprobleme recalculate de mii de ori. Matematicianul inteligent are un caiet de notițe. De fiecare dată când calculează un rezultat, îl scrie în caiet. Data viitoare când cineva îl întreabă același lucru, nu recalculează — deschide caietul și citește răspunsul. Fibonacci de treizeci și opt? Am calculat-o ieri — stă la pagina treizeci și opt din caiet. O secundă. Aceasta este esența Dynamic Programming: memorezi rezultatele subproblemelor pentru a nu le recalcula. Caietul este structura noastră de date — un array sau un HashMap. Fiecare pagină este o subproblemă rezolvată o singură dată.`
    },
    { lbl:'🔁 Memoization — Top-Down',
      html:`Recursie cu cache — pornești de la problema mare, o spargi în subprobleme, memorezi rezultatele.`,
      code:`// Fibonacci fără DP: O(2^n) — exponențial!
int fib(int n) {
    if (n <= 1) return n;
    return fib(n-1) + fib(n-2);
}

// Cu Memoization: O(n) timp, O(n) spațiu
int fibMemo(int n, int[] memo) {
    if (n <= 1) return n;
    if (memo[n] != 0) return memo[n]; // deja calculat!
    memo[n] = fibMemo(n-1, memo) + fibMemo(n-2, memo);
    return memo[n];
}
// Apel: fibMemo(40, new int[41])`,
      vox:`Memoization este abordarea top-down: scriem recursie normală dar adăugăm un cache. Înainte de a calcula, verificăm dacă rezultatul există deja în cache. Dacă da, îl returnăm direct. Fibonacci fără DP are complexitate exponențială O de doi la n. Cu memoization devine O de n timp și O de n spațiu.`
    },
    { lbl:'📊 Tabulation — Bottom-Up',
      html:`Rezolvi mai întâi subproblemele mici, construiești progresiv soluția. Iterativ, fără recursie.`,
      code:`// Fibonacci cu Tabulation: O(n) timp, O(n) spațiu
int fibTab(int n) {
    if (n <= 1) return n;
    int[] dp = new int[n + 1];
    dp[0] = 0; dp[1] = 1;
    for (int i = 2; i <= n; i++)
        dp[i] = dp[i-1] + dp[i-2];
    return dp[n];
}

// Optimizat spațiu: O(1)
int fibOpt(int n) {
    if (n <= 1) return n;
    int a = 0, b = 1;
    for (int i = 2; i <= n; i++) {
        int c = a + b; a = b; b = c;
    }
    return b;
}`,
      vox:`Tabulation este abordarea bottom-up: rezolvi subproblemele mici și construiești progresiv soluția mare. Nu folosești recursie — parcurgi iterativ și completezi o tabelă DP. Pentru Fibonacci: dp de zero egal zero, dp de unu egal unu, și pentru fiecare i de la doi la n calculăm dp de i egal dp de i minus unu plus dp de i minus doi. Dacă fiecare valoare depinde doar de ultimele două, optimizăm spațiul la O de unu.`
    },
    { lbl:'🎯 Pattern: Coin Change',
      html:`Numărul minim de monede pentru o sumă dată.<br><br>
<em>dp[i]</em> = minim de monede pentru suma i &nbsp;•&nbsp; <em>dp[0] = 0</em>`,
      code:`public int coinChange(int[] coins, int amount) {
    int[] dp = new int[amount + 1];
    Arrays.fill(dp, amount + 1);  // "imposibil"
    dp[0] = 0;

    for (int i = 1; i <= amount; i++) {
        for (int coin : coins) {
            if (coin <= i)
                dp[i] = Math.min(dp[i], dp[i - coin] + 1);
        }
    }
    return dp[amount] > amount ? -1 : dp[amount];
}`,
      vox:`Coin Change: dp de i este numărul minim de monede pentru suma i. Inițializăm cu o valoare imposibil de mare, dp de zero egal zero. Pentru fiecare sumă de la unu la amount, parcurgem monedele și actualizăm dp de i ca minimul dintre valoarea curentă și dp de i minus coin plus unu. Complexitate: O de amount ori numărul de monede.`
    },
    { lbl:'🎯 Pattern: 0/1 Knapsack',
      html:`Valoarea maximă cu greutate limitată. Fiecare obiect: îl iei sau nu.<br><br>
<em>dp[i][w]</em> = valoarea maximă folosind primele i obiecte cu capacitate w`,
      code:`public int knapsack(int[] w, int[] v, int cap) {
    int n = w.length;
    int[][] dp = new int[n+1][cap+1];

    for (int i = 1; i <= n; i++) {
        for (int c = 0; c <= cap; c++) {
            dp[i][c] = dp[i-1][c];           // nu luăm obiectul i
            if (w[i-1] <= c)
                dp[i][c] = Math.max(dp[i][c],
                    dp[i-1][c - w[i-1]] + v[i-1]); // îl luăm
        }
    }
    return dp[n][cap];
}`,
      vox:`Zero unu Knapsack: dp de i virgulă c este valoarea maximă folosind primele i obiecte cu capacitate c. Pentru fiecare obiect avem două alegeri: nu îl luăm, caz în care dp de i virgulă c egal dp de i minus unu virgulă c; sau îl luăm dacă încape, caz în care adăugăm valoarea lui la soluția pentru capacitatea rămasă. Luăm maximul dintre cele două.`
    },
    { lbl:'🎯 Pattern: Longest Common Subsequence',
      html:`LCS — cea mai lungă subsecvență comună a două string-uri (elementele nu trebuie consecutive).<br><br>
<em>dp[i][j]</em> = lungimea LCS pentru primele i caractere din s1 și j din s2`,
      code:`public int lcs(String s1, String s2) {
    int m = s1.length(), n = s2.length();
    int[][] dp = new int[m+1][n+1];

    for (int i = 1; i <= m; i++) {
        for (int j = 1; j <= n; j++) {
            if (s1.charAt(i-1) == s2.charAt(j-1))
                dp[i][j] = dp[i-1][j-1] + 1;
            else
                dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
        }
    }
    return dp[m][n];
}
// lcs("ABCBDAB", "BDCAB") → 4`,
      vox:`Longest Common Subsequence: dp de i virgulă j este lungimea LCS pentru primele i caractere din s1 și j caractere din s2. Dacă caracterele curente sunt egale, dp de i virgulă j egal dp de i minus unu virgulă j minus unu plus unu. Altfel, luăm maximul între dp de i minus unu virgulă j și dp de i virgulă j minus unu. Complexitate O de m ori n timp și spațiu.`
    },
    { lbl:'📋 Pași pentru orice problemă DP',
      html:`<strong>1. Definește starea</strong><br>
&nbsp;&nbsp;Ce reprezintă <em>dp[i]</em> sau <em>dp[i][j]</em>?<br><br>
<strong>2. Tranziția</strong><br>
&nbsp;&nbsp;Cum se calculează dp[i] din valori anterioare?<br><br>
<strong>3. Cazul de bază</strong><br>
&nbsp;&nbsp;dp[0] = ?, dp[0][0] = ?<br><br>
<strong>4. Răspunsul final</strong><br>
&nbsp;&nbsp;dp[n], dp[m][n], min/max din dp?<br><br>
<strong>Patternuri:</strong><br>
• <em>Fibonacci</em>: dp[i] = dp[i-1] + dp[i-2]<br>
• <em>Coin Change</em>: min de resurse<br>
• <em>0/1 Knapsack</em>: alegere binară la fiecare pas<br>
• <em>LCS / Edit Distance</em>: dp 2D pe două string-uri`,
      vox:`Pașii pentru orice problemă de DP. Unu: definești starea — ce reprezintă dp de i sau dp de i virgulă j? Doi: identifici tranziția — cum se calculează dp de i din valori anterioare? Trei: stabilești cazul de bază — dp de zero sau dp de zero virgulă zero. Patru: identifici răspunsul final — dp de n, minimul sau maximul din dp. Patternuri frecvente: Fibonacci, Coin Change pentru minimul de resurse, zero unu Knapsack pentru alegeri binare, și LCS sau Edit Distance pentru probleme pe două string-uri.`
    }
  ]
}
];

// ─── ELEVENLABS: LOAD VOICES ──────────────────────────────────────────────────
async function loadVoices() {
  const sel = document.getElementById('voiceSel');
  try {
    const resp = await fetch('/api/voices');
    if (!resp.ok) throw new Error(resp.status);
    const data = await resp.json();

    sel.innerHTML = '';
    // Sort: premade first, then custom
    const sorted = [...data.voices].sort((a, b) => {
      if (a.category === 'premade' && b.category !== 'premade') return -1;
      if (a.category !== 'premade' && b.category === 'premade') return 1;
      return a.name.localeCompare(b.name);
    });

    sorted.forEach(v => {
      const o = document.createElement('option');
      o.value = v.voice_id;
      const accent = v.labels && v.labels.accent ? ` · ${v.labels.accent}` : '';
      const lang   = v.labels && v.labels.language ? ` [${v.labels.language}]` : '';
      o.textContent = `${v.name}${accent}${lang}`;
      if (v.voice_id === VOICE_ID) o.selected = true;
      sel.appendChild(o);
    });

    // If default not found, use first
    if (!sel.value && sorted.length) {
      VOICE_ID = sorted[0].voice_id;
      sel.value = VOICE_ID;
    }
  } catch (e) {
    sel.innerHTML = '<option value="">❌ Eroare API — verifică cheia</option>';
    console.error('ElevenLabs voices error:', e);
  }
}

      });

      if (!resp.ok) {
        const err = await resp.text();
        throw new Error(`${resp.status}: ${err}`);
      }

      const blob = await resp.blob();
      url = URL.createObjectURL(blob);
      audioCache.set(cacheKey, url);
      updateCacheDots();
    }

    curAudio = new Audio(url);
    curAudio.playbackRate = rate;

    curAudio.onended = () => { curAudio = null; if (onEnd) onEnd(); };
    curAudio.onerror = (e) => {
      console.error('Audio playback error:', e);
      curAudio = null;
      if (onEnd) onEnd();
    };

    await curAudio.play();

  } catch (err) {
    console.error('ElevenLabs error:', err);
    status.textContent = '❌ Eroare API';
    playing = false;
    updateUI();
  }
}

// ─── PLAY LOGIC ───────────────────────────────────────────────────────────────
function play() {
  if (curIdx < 0) curIdx = 0;
  playing = true;
  updateUI();
  highlightSec(curIdx);

  const sec = curEp.sections[curIdx];
  const key = `${curEp.id}-${curIdx}`;

  speak(sec.vox, key, () => {
    if (!playing) return;
    curIdx++;
    if (curIdx >= curEp.sections.length) {
      playing = false; curIdx = -1;
      document.getElementById('statusTxt').textContent = '✅ Gata!';
      document.getElementById('progBar').style.width = '100%';
      updateUI();
    } else {
      play();
    }
  });
}

function stop() {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  playing = false;
  updateUI();
}

// ─── UI HELPERS ───────────────────────────────────────────────────────────────
function highlightSec(i) {
  document.querySelectorAll('.sec').forEach((el, j) => {
    el.classList.toggle('active', j === i);
    el.classList.toggle('done', j < i);
  });
  const el = document.getElementById('sec' + i);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  const pct = ((i + 1) / curEp.sections.length * 100).toFixed(0);
  document.getElementById('progBar').style.width = pct + '%';
  document.getElementById('statusTxt').textContent = `${i + 1} / ${curEp.sections.length}`;
}

function updateUI() {
  const btn = document.getElementById('btnPlay');
  btn.textContent = playing ? '⏸' : '▶';
}

function updateCacheDots() {
  curEp.sections.forEach((_, i) => {
    const el = document.getElementById('dot' + i);
    if (el) el.style.display = audioCache.has(`${curEp.id}-${i}`) ? 'inline-block' : 'none';
  });
}

function selectEp(ep) {
  stop();
  curEp = ep; curIdx = -1;
  renderSidebar();
  renderMain();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('epList');
  list.innerHTML = EPISODES.map(ep => `
    <div class="ep-card${ep.id === curEp.id ? ' active' : ''}${ep.locked ? ' locked' : ''}" data-id="${ep.id}">
      <div class="ep-emoji">${ep.emoji}</div>
      <div class="ep-info">
        <div class="ep-title">Ep.${ep.id}: ${ep.title}</div>
        <div class="ep-sub">${ep.subtitle}</div>
        <div class="ep-dur">${ep.dur}</div>
      </div>
      ${ep.locked ? '<span class="ep-lock">🔒</span>' : ''}
    </div>`).join('');

  document.querySelectorAll('.ep-card:not(.locked)').forEach(card => {
    card.addEventListener('click', () => {
      const ep = EPISODES.find(e => e.id == card.dataset.id);
      if (ep) selectEp(ep);
    });
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function hlCode(code) {
  return code.split('\n').map(line => {
    const e = escHtml(line);
    if (e.trimStart().startsWith('//')) return `<span style="color:#6a9955;font-style:italic">${e}</span>`;
    return e
      .replace(/\b(int|String|boolean|void|return|new|public|private|static|for|while|if|else|class|import|Math)\b/g,
        '<span style="color:#569cd6">$1</span>')
      .replace(/\b(\d+)\b/g, '<span style="color:#b5cea8">$1</span>');
  }).join('\n');
}

function renderMain() {
  const ep = curEp;
  document.getElementById('mainArea').innerHTML = `
    <div class="ep-hdr">
      <div class="ep-hdr-top">
        <div class="ep-big-emoji">${ep.emoji}</div>
        <div>
          <div class="ep-num">Episodul ${ep.id} &nbsp;•&nbsp; ${ep.dur}</div>
          <div class="ep-main-title">${ep.title}</div>
          <div class="ep-main-sub">${ep.subtitle}</div>
        </div>
      </div>
      <div class="ep-tags">${ep.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
    <div class="sections" id="sections">
      ${ep.sections.map((s, i) => `
        <div class="sec" id="sec${i}" data-i="${i}">
          <div class="sec-lbl">
            ${s.lbl}
            <span class="cached-dot" id="dot${i}" style="display:${audioCache.has(`${ep.id}-${i}`) ? 'inline-block' : 'none'}" title="Audio cached"></span>
          </div>
          <div class="sec-text">${s.html}</div>
          ${s.code ? `<div class="code-block">${hlCode(s.code)}</div>` : ''}
        </div>`).join('')}
    </div>`;

  document.querySelectorAll('.sec').forEach(el => {
    el.addEventListener('click', () => {
      stop();
      curIdx = parseInt(el.dataset.i);
      play();
    });
  });
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────
document.getElementById('btnPlay').addEventListener('click', () => {
  if (playing) { stop(); }
  else { if (curIdx < 0) curIdx = 0; play(); }
});

document.getElementById('btnNext').addEventListener('click', () => {
  stop();
  if (curIdx < curEp.sections.length - 1) { curIdx++; play(); }
});

document.getElementById('btnPrev').addEventListener('click', () => {
  stop();
  if (curIdx > 0) { curIdx--; play(); }
  else { curIdx = 0; highlightSec(0); }
});

document.getElementById('spdBtn').addEventListener('click', () => {
  spdIdx = (spdIdx + 1) % SPEEDS.length;
  rate = SPEEDS[spdIdx];
  document.getElementById('spdBtn').textContent = rate + '×';
  if (curAudio) curAudio.playbackRate = rate; // aplică imediat
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space')      { e.preventDefault(); document.getElementById('btnPlay').click(); }
  if (e.code === 'ArrowRight') document.getElementById('btnNext').click();
  if (e.code === 'ArrowLeft')  document.getElementById('btnPrev').click();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderSidebar();
renderMain();
</script>
</body>
</html>
